[package]
name = "steamdeck"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gucixdev"]
repository = "https://github.com/Gucixdev/steamdeck"
description = "ProtonUp and Flatseal for the Steam Deck as single binaries"

[lib]
path = "src/lib.rs"

[[bin]]
name = "steamdeck"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "x11", "thread-pool", "crisp"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
dirs = "6"
lzma-rust2 = { version = "0.22", features = ["xz"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# faster dev builds: no debug info for our own crate (stack traces and panics still have file:line)
# the window is drawn by dependencies (iced, wgpu, the text and image code): optimised even in a dev
# build, otherwise the tables with hundreds of rows stutter. Our own crate stays quick to build.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.steamdeck]
debug = "line-tables-only"
opt-level = 1

[dev-dependencies]
iced_test = "0.14"
iced_runtime = "0.14"
